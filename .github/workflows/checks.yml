# Checks every pull request into main or dev. A merge into main then deploys
# (deploy.yml). The Playwright suite isn't here: it takes about half an hour,
# and the UX web loop runs it before work is reported done.
name: Checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Typecheck, legal check, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0 # the Docker image's Node
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run legal:check
      - run: npm run build
        env:
          SITE_URL: https://taskflow.garbar.tech
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:unit
