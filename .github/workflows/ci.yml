# CI: checks every pull request into dev or main. Pull requests go into dev,
# the default branch; a pull request from dev into main is a release, and
# merging it deploys (deploy.yml). The Playwright suite isn't here: it takes about half an hour,
# and the UX web loop runs it before work is reported done.
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Typecheck, legal check, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The Node of the Docker image, read from its Dockerfile, so a Dependabot update of the
      # image's Node is checked on the new one.
      - id: node
        name: The Docker image's Node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -n 1)
          [ -n "$version" ] && echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Node $version"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run legal:check
      - run: npm run build
        env:
          SITE_URL: https://taskflow.garbar.tech
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:unit
